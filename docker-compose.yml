services:
  cms-engine:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      # Requests always come through Caddy, which sets the real client address.
      CMS_TRUST_PROXY: "1"
    # No published ports: the site is reachable only through Caddy.
    expose:
      - "3003"
    volumes:
      # Database and backups: a plain folder next to the project, easy to copy.
      - ./storage:/app/storage
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      cms-engine:
        condition: service_healthy
    env_file:
      - .env.local
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates must survive restarts (Let's Encrypt limits how often they are issued).
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
